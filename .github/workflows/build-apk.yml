name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure Project Structure
        run: |
          mkdir -p www
          if [ ! -f www/index.html ] && [ -f index.html ]; then
            cp index.html www/index.html
          fi

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android
        run: |
          npx cap init "MGE Scanner Pro" "com.mge.scannerpro" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Inject Camera Permissions
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(file)) {
              let xml = fs.readFileSync(file, "utf8");
              const perms = `
                  <uses-permission android:name="android.permission.CAMERA" />
                  <uses-feature android:name="android.hardware.camera" android:required="false" />
                  <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
                  <uses-permission android:name="android.permission.FLASHLIGHT" />
              `;
              if (!xml.includes("android.permission.CAMERA")) {
                xml = xml.replace("</manifest>", perms + "\n</manifest>");
                fs.writeFileSync(file, xml);
              }
            }
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGE-Scanner-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
